<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Financial Crime Detection Engine</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- vis.js -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <script src="script.js" defer></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: white;
        }

        .card {
            background: #1e293b;
            border: none;
            border-radius: 15px;
        }

        #network {
            height: 500px;
            border-radius: 15px;
            background: #0f172a;
        }

        .highlight {
            color: #f87171;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4">
        💸💲REDFLAGNET💲💸
    </h1>

    <div class="card p-4 mb-4 text-center">
        <h5>Upload Transaction CSV</h5>
        <input type="file" id="csvFile" class="form-control my-3">
        <button onclick="uploadFile()" class="btn btn-danger w-100">
            Analyze Transactions
        </button>
    </div>

    <div class="card p-4 mb-4">
        <h5 class="mb-3">Graph Visualization</h5>
        <div id="network"></div>
    </div>

    <div class="card p-4 mb-4">
        <h5 class="mb-3">Fraud Rings Detected</h5>
        <div class="table-responsive">
            <table class="table table-dark table-striped" id="ringTable">
                <thead>
                <tr>
                    <th>Ring ID</th>
                    <th>Pattern</th>
                    <th>Members</th>
                    <th>Risk Score</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="text-center">
        <button id="downloadBtn" class="btn btn-success" style="display:none;">
            Download JSON Report
        </button>
    </div>

</div>

</body>
</html>
