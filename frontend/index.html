<!DOCTYPE html>
<html>
<head>
    <title>REDFLAGNET</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="script.js" defer></script>

    <style>
        body {
            background: #0f172a;
            color: #e1d9d1;
        }

        h1, h5 {
            color: #e1d9d1;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            border: none;
        }

        #network {
            height: 550px;
            background: #0f172a;
            border-radius: 12px;
        }

        .table {
            color: #e1d9d1;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4">REDFLAGNET</h1>

    <div class="card p-4 mb-4">
        <h5>Upload Transaction CSV</h5>
        <input type="file" id="csvFile" class="form-control my-3">
        <button onclick="uploadFile()" class="btn btn-danger w-100">
            Analyze Transactions
        </button>
    </div>

    <div class="card p-4 mb-4">
        <h5>Graph Visualization</h5>
        <div id="network"></div>
    </div>

    <div class="card p-4 mb-4">
        <h5>Fraud Rings</h5>
        <table class="table table-dark table-striped" id="ringTable">
            <thead>
                <tr>
                    <th>Ring ID</th>
                    <th>Pattern</th>
                    <th>Members</th>
                    <th>Risk Score</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="text-center">
        <button id="downloadBtn" class="btn btn-success" style="display:none;">
            Download JSON
        </button>
    </div>

</div>

</body>
</html>
